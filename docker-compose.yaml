# Presenza — Homologação/demonstração (AT02) — PADRÃO: `docker compose` executa ESTE arquivo.
# Topologia AUTÔNOMA: `postgres` e `mailpit` copiados deste arquivo em vez de `include:`
# (docker-compose.dev.yaml continua existindo p/ o fluxo de dev "serviços + app one-off").
# Motivo: o deploy no Coolify ignora a diretiva `include:` e só enxerga os serviços do
# arquivo topo (coollabsio/coolify#5921, #2859) — com o include, chegava a falhar na
# validação: service "app" depends on undefined service "mailpit".
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: presenza-postgres
    environment:
      POSTGRES_USER: presenza
      POSTGRES_PASSWORD: presenza_dev
      POSTGRES_DB: presenza
    ports:
      - "5433:5432"   # host 5433 -> evita conflito com PG local, se houver
    volumes:
      - presenza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presenza -d presenza"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: presenza-mailpit
    ports:
      - "1025:1025"    # SMTP (captura todos os e-mails do dev)
      - "8025:8025"    # Web UI de e-mails capturados

  assistente:
    # RF29–RF34/RNF07 — runtime do Assistente (OpenCode serve + agente "atende").
    # A imagem embute a pasta docs/ (fonte de conhecimento); o agente é somente leitura
    # (docs/.opencode/opencode.json) e o Laravel conversa com ele pela API HTTP interna.
    build:
      context: .
      dockerfile: docker/opencode/Dockerfile
    container_name: presenza-assistente
    working_dir: /docs
    environment:
      # Senha fixa de DEMO do servidor do runtime (Basic auth usado pelo Laravel).
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-presenza-assistente-demo}
      # Chave do gateway de modelos (mesmo valor do .env do time, nunca commitada).
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    expose:
      - "4096"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: presenza-app
    # Código rola EMBUTIDO na imagem (WORKDIR /presenza recusado a montagens em /app)
    working_dir: /presenza
    ports:
      # Host: default 18000 — a 8000 já é do painel do Coolify na VPS (bind falha
      # com "port is already allocated"). A porta do CONTÊINER segue 8000, que é
      # o alvo do proxy do Coolify/subdomínio. Troque o host com APP_PORT se precisar.
      - "${APP_PORT:-18000}:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Zero variáveis p/ definir fora do compose: na VPS/Coolify (sem .env) valem os
      # valores FIXOS abaixo; local, o .env do time continua podendo sobrescrever.
      # APP_URL fixo = domínio público — QR (RF21) e links de e-mail o usam; APP_KEY
      # é fixa de DEMO no repositório (gerar nova se o projeto crescer de escopo).
      APP_URL: ${APP_URL:-http://hackathon.dpicinato.com}
      APP_KEY: ${APP_KEY:-base64:AO4Ysfddk86NQxE3NENRHDm3NQpgmnNjaPxtBoSrEm0=}
      # Hosts internos do compose (jamais localhost aqui — rede própria do compose)
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: presenza
      DB_USERNAME: presenza
      DB_PASSWORD: presenza_dev
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENCRYPTION: null
      MAIL_FROM_ADDRESS: "presenza@usinalins.local"
      MAIL_FROM_NAME: "Presenza"
      # Assistente de IA (RF29) — runtime interno do compose (nome do serviço: assistente)
      ASSISTENTE_URL: http://assistente:4096
      ASSISTENTE_SENHA: ${OPENCODE_SERVER_PASSWORD:-presenza-assistente-demo}
      ASSISTENTE_MODELO: opencode/big-pickle
      # O modelo free pode levar 60-100 s na primeira resposta (cold start/variação);
      # sem retry em timeout (repetir só dobraria a espera) — ver RuntimeAssistente.
      ASSISTENTE_TIMEOUT: "100"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      assistente:
        condition: service_started
    # Reset total (aprovado pela equipe): cada (re)início do contêiner refaz o banco
    # com o seed completo da demo (SEED01–04). Para conservar dados ao vivo, NÃO
    # recriar/reiniciar o contêiner durante a apresentação.
    command:
      - sh
      - -c
      - |
        [ -L public/storage ] || php artisan storage:link
        php artisan migrate:fresh --seed --force
        exec php artisan serve --host=0.0.0.0 --port=8000

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: presenza-scheduler
    working_dir: /presenza
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://hackathon.dpicinato.com}
      APP_KEY: ${APP_KEY:-base64:AO4Ysfddk86NQxE3NENRHDm3NQpgmnNjaPxtBoSrEm0=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: presenza
      DB_USERNAME: presenza
      DB_PASSWORD: presenza_dev
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENCRYPTION: null
      MAIL_FROM_ADDRESS: "presenza@usinalins.local"
      MAIL_FROM_NAME: "Presenza"
    depends_on:
      app:
        condition: service_started
    # vendor vem da própria imagem agora — sem corrida no 1º start
    command: ["php", "artisan", "schedule:work"]

volumes:
  presenza_pgdata:
